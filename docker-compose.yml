

services:
  # 1. The Go Application
  app:
    container_name: crave_glaze_app
    build: .
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # Pass environment variables from .env to the container
    environment:
      # NETWORK OVERRIDES:
      # Inside Docker, the host is the service name "db"
      - DB_HOST=db
      # Inside Docker, Postgres listens on standard 5432
      - DB_PORT=5432
      
      # Pass the rest from your .env file
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      
      - ADMIN_WHATSAPP=${ADMIN_WHATSAPP}
      
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    volumes:
      # Admin-uploaded product images persist across rebuilds
      - uploads_data:/root/web/static/uploads
    networks:
      - default
      - proxy

  # 2. The Database
  db:
    image: postgres:15-alpine
    container_name: crave_glaze_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Loopback-only publish: host ${DB_PORT} -> container 5432.
      # Set DB_PORT=5234 in VPS .env (local dev uses 5433). Never expose publicly.
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  # Shared front-door network with portfolio's Caddy (briankimani.duckdns.org host).
  # Caddy routes craveandglaze.duckdns.org -> crave_glaze_app:8080 over this net.
  # Created on VPS via `docker network create proxy` (workflows do this too).
  proxy:
    external: true

volumes:
  postgres_data:
  uploads_data: