{{template "base" .}}

{{define "title"}}Category{{end}}

{{define "content"}}
<div class="container py-5">
    <h2 class="mb-4 text-center">Our Cakes</h2>
    
    <div class="row row-cols-2 row-cols-md-3 g-3 g-md-4">
        {{range .Products}}
        <div class="col">
            <div class="card h-100 shadow-sm border-0 cake-card">
                <a href="/product?id={{.ID}}">
                    <img src="{{.ImageURL}}" class="card-img-top cake-img" alt="{{.Name}}">
                </a>
                <div class="card-body">
                    <a href="/product?id={{.ID}}" class="text-decoration-none text-dark">
                        <h5 class="card-title fw-bold cake-name">{{.Name}}</h5>
                    </a>
                    <p class="text-muted cake-desc">{{.Description}}</p>
                    <div class="d-grid">
                        <a href="/product?id={{.ID}}" class="btn btn-primary btn-sm">Order</a>
                    </div>
                </div>
            </div>
        </div>
        {{else}}
            <div class="col-12 text-center py-5">
                <h4 class="text-muted">No cakes found in this category yet.</h4>
                <a href="/" class="btn btn-primary mt-3">Back to Home</a>
            </div>
        {{end}}
    </div>
</div>
{{end}}
