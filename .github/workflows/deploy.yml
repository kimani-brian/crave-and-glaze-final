name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/crave-and-glaze
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            docker compose ps
            echo "Waiting for app to become healthy (up to ~2 min)..."
            for i in $(seq 1 12); do
              if curl -fsS -o /dev/null http://localhost:8080/; then
                curl -fsS -o /dev/null -w "HTTP:%{http_code}\n" http://localhost:8080/
                break
              fi
              echo "Attempt $i/12: app not ready yet, retrying in 10s..."
              docker compose logs --tail=5 app || true
              sleep 10
              if [ "$i" = "12" ]; then
                echo "App never became ready. Logs:"
                docker compose logs --tail=50 app
                docker compose logs --tail=20 db
                exit 1
              fi
            done
